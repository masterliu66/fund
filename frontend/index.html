<html lang="en">
  <head>
    <title>基金查询</title>
    <style>
      th:nth-child(2), td:nth-child(2) {
        min-width: 200px;
        text-align: left;
        padding-left: 15px;
        position: relative;
        border-right: 2px solid transparent;
        transition: border-right-color 0.2s;
      }
      th:nth-child(20), td:nth-child(20) {
        min-width: 40px;
        text-align: center;
        position: relative;
      }
      
      .tooltip {
        position: relative;
        display: inline-block;
        cursor: help;
      }
      
      .tooltip .tooltiptext {
        visibility: hidden;
        width: 300px;
        background-color: #333;
        color: #fff;
        text-align: left;
        border-radius: 6px;
        padding: 10px;
        position: absolute;
        z-index: 1;
        bottom: 125%;
        left: 50%;
        margin-left: -150px;
        opacity: 0;
        transition: opacity 0.3s;
        font-size: 14px;
        line-height: 1.4;
        box-shadow: 0 4px 8px rgba(0,0,0,0.2);
      }
      
      .tooltip:hover .tooltiptext {
        visibility: visible;
        opacity: 1;
      }
      
      .icon {
        display: inline-block;
        width: 16px;
        height: 16px;
        border-radius: 50%;
        vertical-align: middle;
      }
      
      .icon-severely-low { 
        background-color: #006400; /* 深绿色 */
        box-shadow: 0 0 2px rgba(0,0,0,0.3);
      }
      .icon-low { 
        background-color: #90EE90; /* 浅绿色 */
        box-shadow: 0 0 2px rgba(0,0,0,0.3);
      }
      .icon-normal { 
        background-color: #FFD700; /* 浅黄色 */
        box-shadow: 0 0 2px rgba(0,0,0,0.3);
      }
      .icon-high { 
        background-color: #FF6B6B; /* 红色 */
        box-shadow: 0 0 2px rgba(0,0,0,0.3);
      }
      .icon-severely-high { 
        background-color: #8B0000; /* 深红色 */
        box-shadow: 0 0 2px rgba(0,0,0,0.3);
      }
      .icon-unknown { 
        background-color: #bfbfbf;
        box-shadow: 0 0 2px rgba(0,0,0,0.3);
      }
      th:nth-child(2) {
        position: relative;
      }
      th:nth-child(2)::after {
        content: "";
        position: absolute;
        right: -4px;
        top: 50%;
        transform: translateY(-50%);
        width: 8px;
        height: 20px;
        cursor: col-resize;
        z-index: 1;
        background: transparent;
        transition: background-color 0.2s;
      }
      th:nth-child(2):hover {
        border-right-color: #c966ea;
      }

      body {
        font-family: Arial,sans-serif;
        background: #667eea;
        color: #999;
        padding: 20px
      }

      .container {
        max-width: 1600px;
        margin: 0 auto; padding: 0 20px
      }

      table {
        width: 100%;
        border-collapse: collapse;
        background: white;
        color: black
      }

      th, td {
        min-width: 68px;
        padding: 10px;
        border: 1px solid #ddd;
        text-align: center
      }

      th {
        background: #667eea;
        color: white
      }

      .detail-button {
          background-color: #4f46e5;
          color: white;
          border: none;
          padding: 4px 12px;
          border-radius: 4px;
          cursor: pointer;
          font-size: 13px;
          transition: all 0.2s;
      }
      
      .detail-button:hover {
          background-color: #4338ca;
          transform: translateY(-1px);
      }
      
      .action-cell {
          text-align: center;
          padding: 8px;
      }
      
      /* Modal styles */
      .modal {
          display: none;
          position: fixed;
          z-index: 1000;
          left: 0;
          top: 0;
          width: 100%;
          height: 100%;
          background-color: rgba(0,0,0,0.5);
      }
      
      .modal-content {
          background-color: #fefefe;
          margin: 5% auto;
          padding: 20px;
          border: 1px solid #888;
          width: 90%;
          max-width: 1000px;
          border-radius: 8px;
          position: relative;
      }
      
      .close {
          color: #aaa;
          float: right;
          font-size: 28px;
          font-weight: bold;
          cursor: pointer;
      }
      
      .close:hover {
          color: black;
      }
      
      .modal-body {
          margin-top: 15px;
      }
      
      @media (max-width: 768px) {
          .modal-content {
              width: 95%;
              margin: 10% auto;
              padding: 15px;
          }
      }

    </style>
  </head>
  <body>
    <div class="container">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
        <h1>📊 基金数据查询</h1>
        <button onclick="goToFundConfig()" style="background: linear-gradient(135deg, #667eea, #764ba2); color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-size: 14px; transition: transform 0.2s, box-shadow 0.2s;" onmouseover="this.style.transform='translateY(-2px)'; this.style.boxShadow='0 4px 12px rgba(102, 126, 234, 0.4)'" onmouseout="this.style.transform='translateY(0)'; this.style.boxShadow='none'">
          ⚙️ 基金配置管理
        </button>
      </div>
      <label><input id="search" placeholder="搜索基金代码"></label>
      <button onclick="search()">搜索</button>
      <button onclick="loadData()">重置</button>
      <div class="controls" style="margin:20px 0;padding:15px;background:rgba(255,255,255,0.1);border-radius:8px">
        <div style="margin-bottom:10px;font-weight:bold">列显示设置:</div>
        <label><input type="checkbox" id="col0" checked onchange="toggleColumn(0)"> 代码</label>
        <label><input type="checkbox" id="col1" checked onchange="toggleColumn(1)"> 名称</label>
        <label><input type="checkbox" id="col2" onchange="toggleColumn(2)"> 历史最高</label>
        <label><input type="checkbox" id="col3" onchange="toggleColumn(3)"> 历史最低</label>
        <label><input type="checkbox" id="col4" checked onchange="toggleColumn(4)"> TP20</label>
        <label><input type="checkbox" id="col5" checked onchange="toggleColumn(5)"> TP80</label>
        <label><input type="checkbox" id="col6" checked onchange="toggleColumn(6)"> TP15</label>
        <label><input type="checkbox" id="col7" checked onchange="toggleColumn(7)"> TP85</label>
        <label><input type="checkbox" id="col8" onchange="toggleColumn(8)"> 1年最高</label>
        <label><input type="checkbox" id="col9" onchange="toggleColumn(9)"> 1年最低</label>
        <label><input type="checkbox" id="col10" checked onchange="toggleColumn(10)"> 90天最高</label>
        <label><input type="checkbox" id="col11" checked onchange="toggleColumn(11)"> 90天最低</label>
        <label><input type="checkbox" id="col12" checked onchange="toggleColumn(12)"> 上月最高</label>
        <label><input type="checkbox" id="col13" checked onchange="toggleColumn(13)"> 上月最低</label>
        <label><input type="checkbox" id="col14" onchange="toggleColumn(14)"> 本月最高</label>
        <label><input type="checkbox" id="col15" onchange="toggleColumn(15)"> 本月最低</label>
        <label><input type="checkbox" id="col16" checked onchange="toggleColumn(16)"> 当日估值</label>
        <label><input type="checkbox" id="col17" checked onchange="toggleColumn(17)"> 当日涨幅</label>
        <label><input type="checkbox" id="col18" checked onchange="toggleColumn(18)"> 估值状态</label>
        <label><input type="checkbox" id="col19" onchange="toggleColumn(19)"> 投资建议</label>
        <label><input type="checkbox" id="col20" onchange="toggleColumn(20)"> 预期年化收益</label>
        <br><br>
        <button onclick="showAllColumns()" style="padding:8px 16px;background:white;color:#667eea;border:none;border-radius:4px;cursor:pointer;font-weight:bold;margin-right:10px">显示全部</button>
        <button onclick="hideAllColumns()" style="padding:8px 16px;background:white;color:#667eea;border:none;border-radius:4px;cursor:pointer;font-weight:bold">隐藏全部</button>
        <button onclick="resetToDefault()" style="padding:8px 16px;background:white;color:#667eea;border:none;border-radius:4px;cursor:pointer;font-weight:bold">恢复默认</button>
      </div>
      <table id="table" style="display:none">
        <thead>
        <tr>
          <th>代码</th>
          <th>名称</th>
          <th>历史最高</th>
          <th>历史最低</th>
          <th>TP20</th>
          <th>TP80</th>
          <th>TP15</th>
          <th>TP85</th>
          <th>1年最高</th>
          <th>1年最低</th>
          <th>90天最高</th>
          <th>90天最低</th>
          <th>上月最高</th>
          <th>上月最低</th>
          <th>本月最高</th>
          <th>本月最低</th>
          <th>当日估值</th>
          <th>当日涨幅</th>
          <th>估值状态</th>
          <th>投资建议</th>
          <th>预期年化收益</th>
          <th>操作</th>
        </tr>
        </thead>
        <tbody id="body"></tbody>
      </table>
      <div id="pagination" style="text-align: center; margin: 20px 0;"></div>
      <div id="msg"></div>
    </div>
    <script>
      const API = window.location.origin;
      const DEFAULT_COLUMN_STATES=[
        true,   // 0: 代码
        true,   // 1: 名称
        false,  // 2: 历史最高 (隐藏)
        false,  // 3: 历史最低 (隐藏)
        true,   // 4: TP20
        true,   // 5: TP80
        true,   // 6: TP15
        true,   // 7: TP85
        false,  // 8: 1年最高 (隐藏)
        false,  // 9: 1年最低 (隐藏)
        true,   // 10: 90天最高
        true,   // 11: 90天最低
        true,   // 12: 上月最高
        true,   // 13: 上月最低
        false,  // 14: 本月最高 (隐藏)
        false,  // 15: 本月最低 (隐藏)
        true,   // 16: 当日估值
        true,   // 17: 当日涨幅
        true,   // 18: 估值状态
        false,  // 19: 投资建议 (隐藏)
        false,  // 20: 预期年化收益 (隐藏)
        true    // 21: 操作
      ];

      let columnStates = [...DEFAULT_COLUMN_STATES];

      function goToFundConfig() {
        window.location.href = '/fund-config';
      }

      let currentPage = 1;
      let pageSize = 20;
      let totalItems = 0;
      let totalPages = 0;

      function loadData(page = 1) {
        currentPage = page;
        const url = API + "/fund?page=" + page + "&pageSize=" + pageSize;
        console.log('loadData - URL:', url);
        fetch(url).then(r => r.json()).then(d => {
          console.log('loadData - Response:', d);
          if (d.code === 0) {
            totalItems = d.data.total;
            totalPages = d.data.totalPages;
            console.log('loadData - totalItems:', totalItems, 'totalPages:', totalPages);
            show(d.data.list);
            renderPagination();
          } else {
            msg("失败")
          }
        }).catch(e => {
          console.error('loadData - Error:', e);
          msg("错误: " + e.message)
        })
      }

      function search() {
        const c = document.getElementById("search").value;
        if (!c) {
          msg("请输入代码");
          return
        }
        fetch(API + "/funds/" + c).then(r => r.json()).then(d => {
          if (d.code === 0) {
            show(d.data)
          } else {
            msg("失败")
          }
        }).catch(e => msg("错误: " + e.message))
      }

      function formatExpectedReturn(min, max) {
        if (!min || !max || min <= 0 || max <= 0) {
          return "-";
        }
        const minP = Math.round(min * 100);
        const maxP = Math.round(max * 100);
        return `${minP}% ~ ${maxP}%`;
      }

      function getValuationIcon(valuationStatus) {
        // Return empty string as we're using background colors now
        return '';
      }
      
      function getValuationIconClass(valuationStatus) {
        switch(valuationStatus) {
          case '严重低估': return 'icon-severely-low';
          case '低估': return 'icon-low';
          case '正常': return 'icon-normal';
          case '高估': return 'icon-high';
          case '严重高估': return 'icon-severely-high';
          default: return 'icon-unknown';
        }
      }

      function show(d) {
          const body = document.getElementById("body");
          body.innerHTML = "";
          d.forEach(item => {
              const row = document.createElement("tr");
              // Create the row content
              row.innerHTML = `
                  <td>${item.FundCode}</td>
                  <td>${item.Name}</td>
                  <td>${fmt(item.HistoryMaxDwjz)}</td>
                  <td>${fmt(item.HistoryMinDwjz)}</td>
                  <td>${fmt(item.Tp80MinDwjz)}</td>
                  <td>${fmt(item.Tp80MaxDwjz)}</td>
                  <td>${fmt(item.Tp85MinDwjz)}</td>
                  <td>${fmt(item.Tp85MaxDwjz)}</td>
                  <td>${fmt(item.LastYearMaxDwjz)}</td>
                  <td>${fmt(item.LastYearMinDwjz)}</td>
                  <td>${fmt(item.LastSeasonMaxDwjz)}</td>
                  <td>${fmt(item.LastSeasonMinDwjz)}</td>
                  <td>${fmt(item.LastMonthMaxDwjz)}</td>
                  <td>${fmt(item.LastMonthMinDwjz)}</td>
                  <td>${fmt(item.MaxDwjz)}</td>
                  <td>${fmt(item.MinDwjz)}</td>
                  <td>${fmt(item.Gsz)}</td>
                  <td>${item.GszzlFormat}</td>
                  <td>${item.valuationStatus || "-"}</td>
                  <td>${item.investAdvice ? 
                      `<div class="tooltip">
                          <div class="icon ${getValuationIconClass(item.valuationStatus)}" title="${item.valuationStatus || '未知'}">
                              ${getValuationIcon(item.valuationStatus)}
                          </div>
                          <span class="tooltiptext">${item.investAdvice}</span>
                      </div>` : 
                      "-"}</td>
                  <td>${formatExpectedReturn(item.expectedReturnMin, item.expectedReturnMax)}</td>
                  <td class="action-cell"><button class="detail-button" onclick="showFundDetail('${item.FundCode}', '${item.Name}')">详情</button></td>
              `;
              body.appendChild(row);
          });
          document.getElementById("table").style.display = "table"
          // Apply column visibility
          applyColumnVisibility();
      }

      function showFundDetail(fundCode, fundName) {
          // Create modal if it doesn't exist
          let modal = document.getElementById('fundDetailModal');
          if (!modal) {
              modal = document.createElement('div');
              modal.id = 'fundDetailModal';
              modal.className = 'modal';
              modal.innerHTML = `
                  <div class="modal-content">
                      <span class="close">&times;</span>
                      <h2>${fundName} (${fundCode})</h2>
                      <div class="modal-body">
                          <iframe src="detail?code=${fundCode}" frameborder="0" style="width: 100%; height: 70vh;"></iframe>
                      </div>
                  </div>
              `;
              document.body.appendChild(modal);
              
              // Add close button functionality
              const closeBtn = modal.querySelector('.close');
              closeBtn.onclick = function() {
                  modal.style.display = 'none';
              };
              
              // Close when clicking outside the modal
              window.onclick = function(event) {
                  if (event.target === modal) {
                      modal.style.display = 'none';
                  }
              };
          } else {
              // Update existing modal content
              modal.querySelector('h2').textContent = `${fundName} (${fundCode})`;
              modal.querySelector('iframe').src = `detail?code=${fundCode}`;
          }
          
          // Show the modal
          modal.style.display = 'block';
      }

      function fmt(n) {
        return n ? parseFloat(n).toFixed(4) : "-"
      }

      function toggleColumn(i) {
        columnStates[i] = !columnStates[i];
        document.getElementById("col" + i).checked = columnStates[i];
        applyColumnVisibility()
      }

      function applyColumnVisibility() {
        const t = document.getElementById("table");
        if (!t) {
          return;
        }
        t.querySelectorAll("tr").forEach(r => {
          r.querySelectorAll("th,td").forEach((c, i) => {
            c.style.display = columnStates[i] ? "" : "none"
          })
        })
      }

      function showAllColumns() {
        for (let i = 0; i < DEFAULT_COLUMN_STATES.length; i++) {
          columnStates[i] = true;
          document.getElementById("col" + i).checked = true
        }
        applyColumnVisibility()
      }

      function hideAllColumns() {
        for (let i = 0; i < DEFAULT_COLUMN_STATES.length; i++) {
          columnStates[i] = false;
          document.getElementById("col" + i).checked = false
        }
        applyColumnVisibility()
      }

      function resetToDefault() {
        for (let i = 0; i < DEFAULT_COLUMN_STATES.length; i++) {
          columnStates[i] = DEFAULT_COLUMN_STATES[i];
          document.getElementById("col" + i).checked = columnStates[i]
        }
        applyColumnVisibility()
      }

      let isResizing = false;
      let startX = 0;
      let startWidth = 0;

      function initColumnResize() {
        const th = document.querySelector("th:nth-child(2)");
        if (!th) {
          return;
        }
        th.addEventListener("mousedown", function (e) {
          if (e.offsetX > th.offsetWidth - 10) {
            isResizing = true;
            startX = e.clientX;
            startWidth = th.offsetWidth;
            e.preventDefault()
          }
        });
        document.addEventListener("mousemove", function (e) {
          if (!isResizing) {
            return;
          }
          const diff = e.clientX - startX;
          const newWidth = Math.max(200, startWidth + diff);
          const cells = document.querySelectorAll("th:nth-child(2),td:nth-child(2)");
          cells.forEach(cell => {
            cell.style.minWidth = newWidth + "px"
          })
        });
        document.addEventListener("mouseup", function () {
          isResizing = false
        })
      }

      function renderPagination() {
        const pagination = document.getElementById('pagination');
        console.log('renderPagination - totalPages:', totalPages, 'currentPage:', currentPage, 'totalItems:', totalItems);
        
        let html = '';
        
        // 创建一个容器来包含所有分页元素
        html += `<div style="display: flex; align-items: center; justify-content: center; gap: 20px; flex-wrap: wrap;">`;
        
        // 每页数量选择器
        html += `
          <div style="color: #e2e8f0; font-weight: bold; display: flex; align-items: center;">
            <span>每页显示:</span>
            <select onchange="changePageSize(this.value)" style="margin: 0 10px; padding: 4px 8px; background: rgba(45, 55, 72, 0.9); color: #e2e8f0; border: 1px solid rgba(148, 163, 184, 0.3); border-radius: 4px;">
              <option value="10" ${pageSize === 10 ? 'selected' : ''}>10</option>
              <option value="20" ${pageSize === 20 ? 'selected' : ''}>20</option>
              <option value="50" ${pageSize === 50 ? 'selected' : ''}>50</option>
            </select>
            <span>条</span>
          </div>
        `;
        
        // 如果总页数大于1，显示分页导航
        if (totalPages > 1) {
          // 分页导航容器
          html += `<div style="display: flex; align-items: center; gap: 5px;">`;
          
          // 上一页
          if (currentPage > 1) {
            html += `<button onclick="loadData(${currentPage - 1})" style="padding: 8px 16px; background: rgba(45, 55, 72, 0.9); color: #e2e8f0; border: 1px solid rgba(148, 163, 184, 0.3); border-radius: 6px; font-weight: bold; cursor: pointer; transition: all 0.2s;">上一页</button>`;
          }
          
          // 页码
          const startPage = Math.max(1, currentPage - 2);
          const endPage = Math.min(totalPages, currentPage + 2);
          
          for (let i = startPage; i <= endPage; i++) {
            if (i === currentPage) {
              html += `<button onclick="loadData(${i})" style="margin: 0 2px; padding: 8px 12px; background: #4a5568; color: #f7fafc; border: 2px solid #718096; border-radius: 6px; font-weight: bold; cursor: pointer; box-shadow: 0 2px 8px rgba(0,0,0,0.3);">${i}</button>`;
            } else {
              html += `<button onclick="loadData(${i})" style="margin: 0 2px; padding: 8px 12px; background: rgba(45, 55, 72, 0.9); color: #e2e8f0; border: 1px solid rgba(148, 163, 184, 0.3); border-radius: 6px; font-weight: bold; cursor: pointer; transition: all 0.2s;">${i}</button>`;
            }
          }
          
          // 下一页
          if (currentPage < totalPages) {
            html += `<button onclick="loadData(${currentPage + 1})" style="padding: 8px 16px; background: rgba(45, 55, 72, 0.9); color: #e2e8f0; border: 1px solid rgba(148, 163, 184, 0.3); border-radius: 6px; font-weight: bold; cursor: pointer; transition: all 0.2s;">下一页</button>`;
          }
          
          html += `</div>`;
        }
        
        // 页面信息
        if (totalItems > 0) {
          const startItem = totalItems > 0 ? (currentPage - 1) * pageSize + 1 : 0;
          const endItem = Math.min(currentPage * pageSize, totalItems);
          html += `<div style="color: #e2e8f0; font-weight: bold; text-shadow: 0 1px 3px rgba(0,0,0,0.5);">第 ${startItem}-${endItem} 条，共 ${totalItems} 条</div>`;
        } else {
          html += `<div style="color: #e2e8f0; font-weight: bold; text-shadow: 0 1px 3px rgba(0,0,0,0.5);">暂无数据</div>`;
        }
        
        // 关闭主容器
        html += `</div>`;
        
        console.log('renderPagination - HTML length:', html.length);
        pagination.innerHTML = html;
        console.log('renderPagination - Pagination element:', pagination.innerHTML.length > 0 ? 'has content' : 'empty');
      }
      
      function changePageSize(newPageSize) {
        pageSize = parseInt(newPageSize);
        currentPage = 1;
        loadData(1);
      }

      window.addEventListener("load", function () {
        initColumnResize();
        loadData();
      });

    </script>
  </body>
</html>
